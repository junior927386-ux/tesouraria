<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Tesouraria DHG</title><meta name=theme-color content="#070b12"><link rel=manifest href=/manifest.webmanifest><link rel=icon href=/icons/icon-192.png><link rel=apple-touch-icon href=/icons/icon-192.png><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Tesouraria DHG"><style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#edf5ff;font:14px system-ui}.wrap{max-width:1150px;margin:auto;padding:25px 18px}.box{background:#0d1420;border:1px solid #1d2b40;border-radius:15px;padding:18px;box-shadow:0 15px 40px #0005}button,input,select{font:inherit}button{cursor:pointer}.btn{padding:10px 14px;border-radius:9px;border:1px solid #263a54;background:#111b2a;color:#fff}.primary{background:#258cff;border-color:#258cff;font-weight:700}.full{width:100%;margin-top:15px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .box{width:min(430px,100%)}input,select{width:100%;padding:11px;margin:6px 0 12px;background:#080e17;color:#fff;border:1px solid #263a54;border-radius:8px}label{font-size:12px;color:#9aacbf}.tabs,.cards,.grid{display:grid;gap:14px}.tabs{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(3,1fr);margin:18px 0}.grid{grid-template-columns:350px 1fr}.card{padding:18px;background:#0d1420;border:1px solid #1d2b40;border-radius:15px}.num{font-size:26px;font-weight:800}.blue{color:#67b1ff}.green{color:#20c98a}.red{color:#ff5268}.active{border-color:#258cff;background:#10233d}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px;border-bottom:1px solid #182536}th{color:#8da0b8}.scroll{overflow:auto}.tag{padding:4px 7px;border-radius:6px;font-size:11px}.entry{background:#0d3027;color:#53dda9}.exit{background:#34151c;color:#ff7a88}.small{background:none;border:0;color:#71a9df}.err{background:#34151c;color:#ff8290;padding:9px;border-radius:8px;margin:10px 0}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body>
<div id=auth class=auth><div class=box><h1>▣ Tesouraria DHG</h1><p>Controle financeiro</p><p id=ver style="font-size:11px;color:#5d7088"></p><div class=tabs><button id=lt class="btn active">Entrar</button><button id=rt class=btn>Criar usuário</button></div><div id=err class="err hidden"></div>
<form id=login><label>Gmail</label><input id=le type=email placeholder=seuemail@gmail.com required><label>Senha</label><input id=lp type=password required><button class="btn primary full">Entrar</button></form>
<form id=register class=hidden><label>Nome</label><input id=rn required><label>Gmail</label><input id=re type=email placeholder=seuemail@gmail.com required><label>Senha</label><input id=rp type=password minlength=8 required><button class="btn primary full">Criar usuário</button></form>
<div id=google class=hidden><hr><button class="btn full" onclick="location='/auth/google'">Entrar com Google</button></div></div></div>
<div id=app class="wrap hidden"><div class=top><h1>▣ Tesouraria DHG</h1><div><span id=user></span> <button id=admb class="btn hidden" onclick=toggleAdm()>Admin</button> <button class=btn onclick=logout()>Sair</button></div></div>
<div id=adm class="box hidden"><h2>Administração</h2><div class=scroll><table><thead><tr><th>Nome</th><th>Gmail</th><th>Mov.</th><th>Saldo</th><th>Perfil</th><th>Ações</th></tr></thead><tbody id=admusers></tbody></table></div><h3 id=admtit></h3><div class=scroll><table><tbody id=admmov></tbody></table></div></div>
<div class=cards><div class=card>Saldo<div id=bal class="num blue">R$ 0,00</div></div><div class=card>Entradas<div id=inc class="num green">R$ 0,00</div></div><div class=card>Saídas<div id=exp class="num red">R$ 0,00</div></div></div>
<div class=grid><div class=box><h2>Nova movimentação</h2><div class=tabs><button id=ent class="btn active">Entrada</button><button id=sai class=btn>Saída</button></div><form id=mov><label>Descrição</label><input id=desc required><label>Valor</label><input id=amount inputmode=decimal required><label>Categoria</label><select id=cat></select><label>Data</label><input id=date type=date required><div id=req class=hidden><label>Nome de quem solicitou</label><input id=name><label>Diretoria / Cargo</label><select id=role></select></div><button class="btn primary full">Registrar</button></form></div>
<div class=box><div class=toolbar><h2>Histórico</h2><select id=filter><option value=todos>Todas</option><option value=entrada>Entradas</option><option value=saida>Saídas</option></select></div><div class=scroll><table><thead><tr><th>Data</th><th>Descrição</th><th>Solicitante</th><th>Cargo</th><th>Tipo</th><th>Valor</th><th>Ações</th></tr></thead><tbody id=tbody></tbody></table></div></div></div></div>
<script>
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
const $=x=>document.getElementById(x),money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});let type="entrada",rows=[],roles=[];
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")},
parseMoney=v=>{v=String(v).trim().replace(/[^\d.,]/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,"");return Number(v)};
async function api(u,o={}){let r=await fetch(u,{...o,headers:{"Content-Type":"application/json"}}),d=await r.json().catch(()=>({}));if(r.status==401&&!u.startsWith("/api/login")&&!u.startsWith("/api/register")&&!u.startsWith("/api/me")){showAuth();throw Error(d.error||"Sessão expirada. Entre novamente.")}if(!r.ok)throw Error(d.error||"Erro");return d}
function err(x){$("err").textContent=x;$("err").classList.remove("hidden")}
function showAuth(){$("app").classList.add("hidden");$("auth").classList.remove("hidden")}
$("lt").onclick=()=>{$("err").classList.add("hidden");$("login").classList.remove("hidden");$("register").classList.add("hidden");$("lt").classList.add("active");$("rt").classList.remove("active")};
$("rt").onclick=()=>{$("err").classList.add("hidden");$("register").classList.remove("hidden");$("login").classList.add("hidden");$("rt").classList.add("active");$("lt").classList.remove("active")};
async function enter(u){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent=u.name+" • "+u.email+(u.is_admin?" • Admin":"");$("admb").classList.toggle("hidden",!u.is_admin);await load()}
$("login").onsubmit=async e=>{e.preventDefault();try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("le").value,password:$("lp").value})});await enter(x.user)}catch(x){err(x.message)}};
$("register").onsubmit=async e=>{e.preventDefault();try{let x=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("rn").value,email:$("re").value,password:$("rp").value})});await enter(x.user)}catch(x){err(x.message)}};
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}
function setType(t){type=t;$("ent").className="btn"+(t=="entrada"?" active":"");$("sai").className="btn"+(t=="saida"?" active":"");$("req").classList.toggle("hidden",t!="saida");$("name").required=t=="saida";$("role").required=t=="saida";let a=t=="saida"?["Compras","Despesas","Retirada","Pagamento","Outros"]:["Vendas","Serviços","Troco","Outros"];$("cat").innerHTML=a.map(x=>`<option>${x}</option>`).join("")}
$("ent").onclick=()=>setType("entrada");$("sai").onclick=()=>setType("saida");
$("mov").onsubmit=async e=>{e.preventDefault();try{await api("/api/movements",{method:"POST",body:JSON.stringify({type,description:$("desc").value,amount:parseMoney($("amount").value),category:$("cat").value,date:$("date").value,requesterName:$("name").value,requesterRole:$("role").value})});e.target.reset();$("date").value=today();setType(type);await load();alert(type=="saida"?"Saída registrada. Use o botão Recibo no histórico.":"Entrada registrada.")}catch(x){alert(x.message)}};
async function load(){rows=await api("/api/movements");render()}
async function del(id){if(confirm("Excluir?")){await api("/api/movements/"+id,{method:"DELETE"});load()}}
function toggleAdm(){let a=$("adm"),show=a.classList.contains("hidden");a.classList.toggle("hidden",!show);document.querySelectorAll("#app>.cards,#app>.grid").forEach(x=>x.classList.toggle("hidden",show));$("admb").textContent=show?"Voltar":"Admin";if(show){$("admmov").innerHTML="";$("admtit").textContent="";loadAdm()}}
async function loadAdm(){try{let u=await api("/api/admin/users");$("admusers").innerHTML=u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.movements}</td><td>${money(x.balance)}</td><td>${x.is_admin?"Admin":"Usuário"}</td><td><button class=small onclick="admView(${x.id},'${esc(x.name).replace(/'/g,"")}')">Ver</button><button class=small onclick="admRole(${x.id},${x.is_admin?0:1})">${x.is_admin?"Remover admin":"Tornar admin"}</button><button class=small onclick="admPass(${x.id})">Nova senha</button><button class=small onclick="admDel(${x.id})">Excluir</button></td></tr>`).join("")}catch(e){alert(e.message)}}
async function admView(id,n){try{let m=await api("/api/admin/movements?user_id="+id);$("admtit").textContent="Movimentações de "+n;$("admmov").innerHTML=m.map(x=>`<tr><td>${new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")}</td><td>${esc(x.description)}</td><td>${esc(x.requester_name)||"—"}</td><td>${x.type=="entrada"?"Entrada":"Saída"}</td><td>${money(x.amount)}</td><td>${x.type=="saida"?`<button class=small onclick="window.open('/api/movements/${x.id}/receipt','_blank')">Recibo</button>`:""}</td></tr>`).join("")||"<tr><td>Sem movimentações.</td></tr>"}catch(e){alert(e.message)}}
async function admRole(id,on){try{await api("/api/admin/users/"+id+"/admin",{method:"POST",body:JSON.stringify({admin:!!on})});loadAdm()}catch(e){alert(e.message)}}
async function admPass(id){let p=prompt("Nova senha (mínimo 8 caracteres):");if(!p)return;try{await api("/api/admin/users/"+id+"/password",{method:"POST",body:JSON.stringify({password:p})});alert("Senha alterada.")}catch(e){alert(e.message)}}
async function admDel(id){if(!confirm("Excluir este usuário e todas as movimentações dele?"))return;try{await api("/api/admin/users/"+id,{method:"DELETE"});loadAdm()}catch(e){alert(e.message)}}
function render(){let i=rows.filter(x=>x.type=="entrada").reduce((a,x)=>a+Math.round(x.amount*100),0)/100,o=rows.filter(x=>x.type=="saida").reduce((a,x)=>a+Math.round(x.amount*100),0)/100;$("inc").textContent=money(i);$("exp").textContent=money(o);$("bal").textContent=money(Math.round((i-o)*100)/100);let f=$("filter").value,l=rows.filter(x=>f=="todos"||x.type==f);$("tbody").innerHTML=l.map(x=>`<tr><td>${new Date(x.date+"T12:00:00").toLocaleDateString("pt-BR")}</td><td>${esc(x.description)}</td><td>${esc(x.requester_name)||"—"}</td><td>${esc(x.requester_role)||"—"}</td><td><span class="tag ${x.type=="entrada"?"entry":"exit"}">${x.type=="entrada"?"ENTRADA":"SAÍDA"}</span></td><td>${money(x.amount)}</td><td>${x.type=="saida"?`<button class=small onclick="window.open('/api/movements/${x.id}/receipt','_blank')">Recibo</button>`:""}<button class=small onclick="del(${x.id})">Excluir</button></td></tr>`).join("")}
$("filter").onchange=render;
(async()=>{let c=await api("/api/config");roles=c.roles;$("ver").textContent="v"+c.version;$("role").innerHTML=roles.map(x=>`<option>${x}</option>`).join("");$("date").value=today();setType("entrada");let gp=new URLSearchParams(location.search).get("google");if(gp){history.replaceState(null,"","/");err(gp=="disabled"?"Login com Google não está configurado.":"Não foi possível entrar com o Google.")}if(c.googleEnabled)$("google").classList.remove("hidden");let m=await api("/api/me");if(m.user)enter(m.user)})().catch(e=>err(e.message));
</script></body></html>
